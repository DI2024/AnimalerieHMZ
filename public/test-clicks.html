<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test des Clics - Diagnostic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .test-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        button {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.4);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(240, 147, 251, 0.4);
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        
        .console-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .console-log div {
            margin-bottom: 5px;
        }
        
        .console-log .success {
            color: #4ec9b0;
        }
        
        .console-log .error {
            color: #f48771;
        }
        
        .console-log .info {
            color: #569cd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test des Clics</h1>
        <p class="subtitle">Diagnostic pour vérifier que les clics fonctionnent</p>
        
        <!-- Test 1 : onclick -->
        <div class="test-section">
            <h2>Test 1 : Attribut onclick</h2>
            <button class="btn-primary" onclick="test1()">Cliquer ici (onclick)</button>
        </div>
        
        <!-- Test 2 : addEventListener -->
        <div class="test-section">
            <h2>Test 2 : addEventListener</h2>
            <button id="test2" class="btn-success">Cliquer ici (addEventListener)</button>
        </div>
        
        <!-- Test 3 : querySelector + class -->
        <div class="test-section">
            <h2>Test 3 : querySelector avec class</h2>
            <button class="test-btn btn-warning">Cliquer ici (querySelector)</button>
        </div>
        
        <!-- Test 4 : Event delegation -->
        <div class="test-section">
            <h2>Test 4 : Event delegation</h2>
            <button class="delegated-btn btn-primary" data-test="4">Cliquer ici (delegation)</button>
        </div>
        
        <!-- Status -->
        <div id="status"></div>
        
        <!-- Console Log -->
        <div class="console-log" id="consoleLog">
            <div class="info">Console de diagnostic...</div>
        </div>
    </div>
    
    <script>
        // Console personnalisée
        function log(message, type = 'info') {
            const consoleLog = document.getElementById('consoleLog');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
            console.log(message);
        }
        
        // Afficher le statut
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
            status.style.display = 'block';
        }
        
        // Test 1 : onclick
        function test1() {
            log('✅ Test 1 réussi : onclick fonctionne !', 'success');
            showStatus('✅ Test 1 : onclick fonctionne !', 'success');
            alert('Test 1 réussi !\n\nLe clic avec onclick fonctionne correctement.');
        }
        
        // Test 2 : addEventListener
        document.addEventListener('DOMContentLoaded', function() {
            log('📄 DOM chargé', 'info');
            
            const test2Btn = document.getElementById('test2');
            if (test2Btn) {
                test2Btn.addEventListener('click', function() {
                    log('✅ Test 2 réussi : addEventListener fonctionne !', 'success');
                    showStatus('✅ Test 2 : addEventListener fonctionne !', 'success');
                    alert('Test 2 réussi !\n\nLe clic avec addEventListener fonctionne correctement.');
                });
                log('✓ Event listener attaché au bouton test2', 'info');
            } else {
                log('❌ Erreur : Bouton test2 introuvable', 'error');
            }
            
            // Test 3 : querySelector
            const test3Btn = document.querySelector('.test-btn');
            if (test3Btn) {
                test3Btn.addEventListener('click', function() {
                    log('✅ Test 3 réussi : querySelector fonctionne !', 'success');
                    showStatus('✅ Test 3 : querySelector fonctionne !', 'success');
                    alert('Test 3 réussi !\n\nLe clic avec querySelector fonctionne correctement.');
                });
                log('✓ Event listener attaché au bouton test3', 'info');
            } else {
                log('❌ Erreur : Bouton test3 introuvable', 'error');
            }
            
            // Test 4 : Event delegation
            document.addEventListener('click', function(e) {
                const delegatedBtn = e.target.closest('.delegated-btn');
                if (delegatedBtn) {
                    const testNum = delegatedBtn.dataset.test;
                    log(`✅ Test ${testNum} réussi : Event delegation fonctionne !`, 'success');
                    showStatus(`✅ Test ${testNum} : Event delegation fonctionne !`, 'success');
                    alert(`Test ${testNum} réussi !\n\nLe clic avec event delegation fonctionne correctement.`);
                }
            });
            log('✓ Event delegation configuré', 'info');
            
            log('🚀 Tous les tests sont prêts !', 'success');
            showStatus('🚀 Tous les tests sont prêts ! Cliquez sur les boutons.', 'info');
        });
        
        // Vérifier si JavaScript est activé
        log('✓ JavaScript est activé', 'success');
        
        // Vérifier le navigateur
        log(`Navigateur : ${navigator.userAgent}`, 'info');
        
        // Vérifier la taille de l'écran
        log(`Écran : ${window.innerWidth}x${window.innerHeight}`, 'info');
    </script>
</body>
</html>
